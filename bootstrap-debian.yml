---
- name: Bootstrap Debian server
  hosts: "{{ target_host | mandatory }}"
  become: true
  gather_facts: false

  # vars:
  #   ntp_servers: x.x.x.x y.y.y.y
  #   nft_template_file_name: templates/default_web_server.conf
  pre_tasks:
    - name: Validate ntp servers
      ansible.builtin.assert:
        that:
          - ntp_servers is defined
          - ntp_servers | length > 0
        fail_msg: "Specify a safe ntp_servers using --extra-vars"
    - name: Validate nft config template
      ansible.builtin.assert:
        that:
          - nft_template_file_name is defined
          - nft_template_file_name | length > 0
        fail_msg: "Specify a safe nft_template_file_name using --extra-vars"
  tasks:
  - name: Install base utilities.
    ansible.builtin.apt:
      name:
        - net-tools
        - htop
        - iftop
        - mc
        - tzdata
        - git
        - curl
      state: present
  - name: Disable IPv6
    ansible.builtin.lineinfile:
      path: "/etc/default/grub"
      regexp: "^GRUB_CMDLINE_LINUX_DEFAULT"
      line: "GRUB_CMDLINE_LINUX_DEFAULT=\"quiet ipv6.disable=1\""
      state: present
    notify: Update GRUB
  - name: Configure NTP
    ansible.builtin.lineinfile:
      path: "/etc/systemd/timesyncd.conf"
      regexp: "^NTP="
      line: "NTP={{ ntp_servers }}"
      state: present
      create: true
    notify: Restart systemd-timesyncd
  - name: Configure NFTables
    ansible.builtin.template:
      src: "{{ nft_template_file_name }}"
      dest: /etc/nftables.conf
      owner: root
      group: root
      mode: "600"
  - name: Enable the firewall
    ansible.builtin.systemd_service:
      name: nftables
      enabled: true
      state: started


  handlers:
    - name: Update GRUB
      ansible.builtin.command:
        cmd: /usr/sbin/update-grub

    - name: Restart systemd-timesyncd
      ansible.builtin.systemd_service:
        name: systemd-timesyncd
        state: restarted



